<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica o tema salvo (ou a preferência do SO) antes do primeiro paint —
         script síncrono, fora de um module e fora do React, para não piscar
         claro→escuro enquanto o bundle carrega. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gfm-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <!-- favicon inline: evita qualquer requisição extra de rede -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E141B'/%3E%3Cpath d='M6 23 L16 8 L26 23' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='19' r='3' fill='%23B26A00'/%3E%3C/svg%3E"
    />
    <title>Guardian FOV Monitor — Relatório de Exceções de Campo de Visão</title>
    <meta name="description" content="Análise local de exceções de FOV do sistema Guardian (Caterpillar). Processamento 100% no navegador." />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
